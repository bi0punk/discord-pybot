[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-pybot"
version = "1.0.0"
description = "Discord bot with mathematical calculation, NLTK-based chatbot conversation, scheduled auto-messaging, and custom commands."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "nltk>=3.8",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
